spring:
  application:
    name: galae
  datasource:
    url: jdbc:h2:file:./data/galae-local;MODE=MariaDB;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=VALUE,USER
    username: sa
    password: ''
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  access-token:
    expr-time: 3600
  refresh-token:
    expr-time: 1209600

cors:
  allowed-origins: http://localhost:*,http://127.0.0.1:*,capacitor://localhost

galae:
  zone: Asia/Seoul
  feed:
    include-unchecked: false
  seed:
    enabled: true
